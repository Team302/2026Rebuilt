name: Update Codebase Context

on:
  push:
    branches:
      - main
    paths:
      - "src/main/**"
      - "build.gradle"
      - "build.gradle.kts"

permissions:
  contents: write
  pull-requests: write
  models: read # Required for GitHub Models / Copilot API access

jobs:
  update-context:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout full history so we can diff ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Gather source files under src/main ────────────────────────────────
      # Only sends full content for files that actually changed in this push.
      # Unchanged files are listed by name only so the model knows they exist
      # but has no excuse to rewrite their context sections.
      - name: Collect src/main source files
        id: gather
        run: |
          # ── Collect changed paths in one diff covering ALL relevant paths ────
          # Build files are diffed separately from src/main so they're never
          # missed when both change in the same push.
          CHANGED_SRC=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
                        -- 'src/main/**' || true)
          CHANGED_BUILD=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
                          -- 'build.gradle' 'build.gradle.kts' || true)

          # Combine into one newline-separated list for membership checks
          ALL_CHANGED=$(printf '%s\n%s' "$CHANGED_SRC" "$CHANGED_BUILD" | sed '/^$/d' | sort -u)

          echo "Files changed in this push:"
          echo "$ALL_CHANGED"

          # ── Helper: exact line-anchored membership test ───────────────────────
          # grep -qF can match "Foo.cpp" inside "SubFoo.cpp" because it's a
          # substring search. grep -qxF requires the entire line to match,
          # so "src/main/Foo.cpp" only matches "src/main/Foo.cpp" exactly.
          is_changed() {
            echo "$ALL_CHANGED" | grep -qxF "$1"
          }

          CHANGED_DUMP=""
          UNCHANGED_LIST=""
          FILE_LIST=""

          # ── C++ sources (.cpp, .h, .hpp) ─────────────────────────────────────────
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            FILE_LIST="${FILE_LIST}${rel}\n"

            if is_changed "$rel"; then
              CHANGED_DUMP="${CHANGED_DUMP}\n\n### CHANGED FILE: ${rel}\n\`\`\`cpp\n$(head -c 6000 "$file")\n\`\`\`"
            else
              UNCHANGED_LIST="${UNCHANGED_LIST}  - ${rel}\n"
            fi
          done < <(find src/main \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -print0 | sort -z)

          # ── Resource / config files (json, xml, yaml, toml, csv, properties) ─
          # These can affect context (e.g. vendordeps, deploy configs, auton CSVs)
          # and are included under src/main/** in the trigger.
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            FILE_LIST="${FILE_LIST}${rel}\n"

            if is_changed "$rel"; then
              CHANGED_DUMP="${CHANGED_DUMP}\n\n### CHANGED FILE: ${rel}\n\`\`\`\n$(head -c 3000 "$file")\n\`\`\`"
            else
              UNCHANGED_LIST="${UNCHANGED_LIST}  - ${rel}\n"
            fi
          done < <(find src/main \
                     \( -name "*.json" -o -name "*.xml" -o -name "*.yaml" \
                        -o -name "*.yml" -o -name "*.toml" -o -name "*.csv" \
                        -o -name "*.properties" \) \
                     -print0 | sort -z)

          # ── Build files (diffed independently of src/main/**) ─────────────────
          for f in build.gradle build.gradle.kts; do
            [ -f "$f" ] || continue
            FILE_LIST="${FILE_LIST}${f}\n"
            if is_changed "$f"; then
              CHANGED_DUMP="${CHANGED_DUMP}\n\n### CHANGED FILE: ${f}\n\`\`\`groovy\n$(cat "$f")\n\`\`\`"
            else
              UNCHANGED_LIST="${UNCHANGED_LIST}  - ${f}\n"
            fi
          done

          # ── Existing context ──────────────────────────────────────────────────
          EXISTING_CONTEXT=""
          [ -f ".github/CODEBASE_CONTEXT.md" ] && EXISTING_CONTEXT=$(cat .github/CODEBASE_CONTEXT.md)
          EXISTING_LINES=$(wc -l < .github/CODEBASE_CONTEXT.md 2>/dev/null || echo "0")

          printf '%b' "$CHANGED_DUMP"     > /tmp/changed_dump.txt
          printf '%b' "$UNCHANGED_LIST"   > /tmp/unchanged_list.txt
          printf '%b' "$FILE_LIST"        > /tmp/file_list.txt
          printf '%s' "$EXISTING_CONTEXT" > /tmp/existing_context.txt
          echo "$EXISTING_LINES"          > /tmp/existing_lines.txt

          echo "Existing context: ${EXISTING_LINES} lines"

      # ── 3. Call GitHub Models (Copilot-backed) to update context ─────────────
      - name: Generate updated context via Copilot
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_DUMP=$(cat /tmp/changed_dump.txt)
          UNCHANGED_LIST=$(cat /tmp/unchanged_list.txt)
          FILE_LIST=$(cat /tmp/file_list.txt)
          EXISTING=$(cat /tmp/existing_context.txt)
          EXISTING_LINES=$(cat /tmp/existing_lines.txt)

          PROMPT="You are a senior FRC (FIRST Robotics Competition) software engineer maintaining \`.github/CODEBASE_CONTEXT.md\` for a WPILib-based robot codebase (2026 season).\
           This file is read by GitHub Copilot as repo-wide context, so it must be maximally useful to an AI coding assistant and human developers alike.\
           \n\n## YOUR TASK\
           \nA push to main changed a small number of files. Update ONLY the sections of the existing context that are directly affected by those changed files.\
           \nAll other sections must be reproduced VERBATIM — do not rephrase, summarize, condense, or restructure them.\
           \n\n## STRICT RULES\
           \n1. The output MUST be at least ${EXISTING_LINES} lines. The existing file is ${EXISTING_LINES} lines. Do NOT produce a shorter file.\
           \n2. Do NOT remove any section, heading, table row, or bullet point unless the source file that introduced it was deleted in this push.\
           \n3. Do NOT rewrite sections whose source files are listed under UNCHANGED FILES.\
           \n4. Preserve all season-specific wording, manual notes, ⚠️ warnings, and checklist items exactly.\
           \n5. Only output the raw Markdown — no preamble, no explanation.\
           \n\n## CHANGED FILES (full source — update context for these only)\
           \n${CHANGED_DUMP}\
           \n\n## UNCHANGED FILES (these exist but did NOT change — do not touch their context sections)\
           \n${UNCHANGED_LIST}\
           \n\n## EXISTING CODEBASE_CONTEXT.md (${EXISTING_LINES} lines — reproduce in full, editing only sections affected by changed files above)\
           \n${EXISTING}"

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              '{
                model: "gpt-4o",
                messages: [{ role: "user", content: $prompt }],
                max_tokens: 8192,
                temperature: 0.1
              }')" \
            "https://models.inference.ai.azure.com/chat/completions")

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > /tmp/new_context.md

          NEW_LINES=$(wc -l < /tmp/new_context.md)
          EXISTING_LINES=$(cat /tmp/existing_lines.txt)
          echo "Existing context: ${EXISTING_LINES} lines — Generated context: ${NEW_LINES} lines"

          if [ "$NEW_LINES" -lt 5 ]; then
            echo "ERROR: Generated context looks too short. Raw response:"
            echo "$RESPONSE"
            exit 1
          fi

          # Warn loudly if the model shrunk the file significantly (>15% loss)
          THRESHOLD=$(( EXISTING_LINES * 85 / 100 ))
          if [ "$NEW_LINES" -lt "$THRESHOLD" ]; then
            echo "WARNING: Generated context is ${NEW_LINES} lines but existing is ${EXISTING_LINES} lines (threshold: ${THRESHOLD})."
            echo "The model may have incorrectly removed content. Review the PR carefully before merging."
          fi

      # ── 4. Check if anything actually changed ────────────────────────────────
      - name: Check for changes
        id: diff
        run: |
          if diff -q .github/CODEBASE_CONTEXT.md /tmp/new_context.md > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to CODEBASE_CONTEXT.md — skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ── 5. Ensure required labels exist ──────────────────────────────────────
      - name: Ensure PR labels exist
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "documentation" --color "0075ca" --description "Improvements or additions to documentation" 2>/dev/null || true
          gh label create "automated"     --color "e4e669" --description "Opened automatically by a GitHub Actions bot"  2>/dev/null || true

      # ── 6. Commit to a new branch and open a PR ───────────────────────────────
      - name: Create PR with updated context
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="bot/update-codebase-context-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          cp /tmp/new_context.md .github/CODEBASE_CONTEXT.md

          git add .github/CODEBASE_CONTEXT.md
          git commit -m "docs: auto-update .github/CODEBASE_CONTEXT.md from src/main changes

          Triggered by push to main.
          Updated by GitHub Copilot (gpt-4o via GitHub Models).
          [skip ci]"

          git push origin "$BRANCH"

          # Line count delta for the PR body
          NEW_LINES=$(wc -l < /tmp/new_context.md)
          EXISTING_LINES=$(cat /tmp/existing_lines.txt)
          LINE_DELTA=$(( NEW_LINES - EXISTING_LINES ))
          if [ "$LINE_DELTA" -ge 0 ]; then
            DELTA_STR="+${LINE_DELTA}"
          else
            DELTA_STR="${LINE_DELTA} ⚠️ lines were removed — review carefully"
          fi

          # Changed files list for PR body (covers src/main AND build files)
          CHANGED_LIST=""
          ALL_CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
                        -- 'src/main/**' 'build.gradle' 'build.gradle.kts' || true)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            CHANGED_LIST="${CHANGED_LIST}- \`${f}\`"$'\n'
          done <<< "$ALL_CHANGED"

          gh pr create \
            --title "docs: Update .github/CODEBASE_CONTEXT.md (auto-generated)" \
            --body "## 🤖 Automated Codebase Context Update

          This PR was automatically generated after a push to \`main\` modified files under \`src/main/\` or build files.
          Only sections relevant to the changed files below were updated; all other sections are unchanged.

          ### Source files changed
          ${CHANGED_LIST}
          ### Line count
          ${EXISTING_LINES} → ${NEW_LINES} (${DELTA_STR})

          > **Please review before merging.** If lines were unexpectedly removed, edit this branch directly before merging.

          ### Trigger commit
          - Commit: \`${{ github.sha }}\`
          - Author: \`${{ github.actor }}\`
          - Pushed at: \`$(date -u)\`" \
            --head "$BRANCH" \
            --base "main" \
            --label "documentation" \
            --label "automated"