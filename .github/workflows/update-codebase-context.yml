name: Update Codebase Context

on:
  push:
    branches:
      - main
    paths:
      - "src/main/**"
      - "build.gradle"
      - "build.gradle.kts"
  workflow_dispatch: # Allow manual runs from the GitHub Actions UI or CLI

permissions:
  contents: write
  pull-requests: write
  models: read # Required for GitHub Models / Copilot API access

jobs:
  update-context:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout full history so we can diff ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Gather source files under src/main ────────────────────────────────
      # Sends full content for changed text files, path-only for unchanged,
      # and an explicit DELETED/RENAMED section so the model knows to remove
      # or update those context sections.
      - name: Collect src/main source files
        id: gather
        run: |
          # ── Get full name-status diff covering ALL relevant paths ─────────────
          # --name-status shows Added(A), Modified(M), Deleted(D), Renamed(R) etc.
          # We use this to build the explicit deleted/renamed list AND to decide
          # which files are "changed" for the content dump.
          # For workflow_dispatch runs github.event.before is empty — treat all files as changed.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Manual run or no before SHA — treating all src/main files as changed."
            ALL_STATUS=$(git ls-files --format='M	%(path)' -- 'src/main/**' 'build.gradle' 'build.gradle.kts' 2>/dev/null || \
                         git ls-tree -r --name-only HEAD -- src/main build.gradle build.gradle.kts | sed 's/^/M\t/' || true)
          else
            ALL_STATUS=$(git diff --name-status "$BEFORE" ${{ github.sha }} \
                         -- 'src/main/**' 'build.gradle' 'build.gradle.kts' || true)
          fi

          echo "File statuses in this push:"
          echo "$ALL_STATUS"

          # ── Helper: exact line-anchored membership test ───────────────────────
          # grep -qxF requires the entire line to match, preventing "Foo.cpp"
          # from falsely matching inside "SubFoo.cpp".
          is_changed() {
            # Matches any status line whose last tab-delimited field equals $1
            echo "$ALL_STATUS" | awk -F'\t' '{print $NF}' | grep -qxF "$1"
          }

          # ── Build explicit DELETED / RENAMED section ──────────────────────────
          DELETED_LIST=""
          while IFS='	' read -r status path1 path2; do
            [ -z "$status" ] && continue
            case "$status" in
              D*)
                DELETED_LIST="${DELETED_LIST}  - DELETED: \`${path1}\`\n"
                ;;
              R*)
                DELETED_LIST="${DELETED_LIST}  - RENAMED: \`${path1}\` → \`${path2}\`\n"
                ;;
            esac
          done <<< "$ALL_STATUS"

          # ── Helpers for file type handling ────────────────────────────────────
          is_text_ext() {
            case "$1" in
              *.cpp|*.h|*.hpp|*.c|\
              *.json|*.xml|*.yaml|*.yml|*.toml|*.csv|*.properties|\
              *.traj|*.chor|*.txt|*.md|*.gradle|*.kts)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          lang_for() {
            case "$1" in
              *.cpp|*.h|*.hpp|*.c) echo "cpp" ;;
              *.gradle|*.kts)      echo "groovy" ;;
              *.json|*.traj|*.chor) echo "json" ;;
              *.xml)               echo "xml" ;;
              *.yaml|*.yml)        echo "yaml" ;;
              *.toml)              echo "toml" ;;
              *)                   echo "" ;;
            esac
          }

          CHANGED_DUMP=""
          UNCHANGED_LIST=""

          # ── Walk EVERY file currently in src/main (all extensions) ───────────
          # Using -type f with no extension filter ensures nothing is silently
          # omitted from the unchanged list, including .traj, .chor, .txt, etc.
          while IFS= read -r -d '' file; do
            rel="${file#./}"

            if is_changed "$rel"; then
              if is_text_ext "$rel"; then
                LANG=$(lang_for "$rel")
                CHANGED_DUMP="${CHANGED_DUMP}\n\n### CHANGED FILE: ${rel}\n\`\`\`${LANG}\n$(head -c 6000 "$file")\n\`\`\`"
              else
                # Binary/unknown — flag as changed so model is aware, no content
                CHANGED_DUMP="${CHANGED_DUMP}\n\n### CHANGED FILE (binary): ${rel}"
              fi
            else
              UNCHANGED_LIST="${UNCHANGED_LIST}  - ${rel}\n"
            fi
          done < <(find src/main -type f -print0 | sort -z)

          # ── Build files (outside src/main, diffed separately) ─────────────────
          for f in build.gradle build.gradle.kts; do
            [ -f "$f" ] || continue
            if is_changed "$f"; then
              CHANGED_DUMP="${CHANGED_DUMP}\n\n### CHANGED FILE: ${f}\n\`\`\`groovy\n$(cat "$f")\n\`\`\`"
            else
              UNCHANGED_LIST="${UNCHANGED_LIST}  - ${f}\n"
            fi
          done

          # ── Existing context ──────────────────────────────────────────────────
          EXISTING_CONTEXT=""
          [ -f ".github/CODEBASE_CONTEXT.md" ] && EXISTING_CONTEXT=$(head -c 60000 .github/CODEBASE_CONTEXT.md)
          EXISTING_LINES=$(wc -l < .github/CODEBASE_CONTEXT.md 2>/dev/null || echo "0")

          printf '%b' "$CHANGED_DUMP"     > /tmp/changed_dump.txt
          printf '%b' "$UNCHANGED_LIST"   > /tmp/unchanged_list.txt
          printf '%b' "$DELETED_LIST"     > /tmp/deleted_list.txt
          printf '%s' "$EXISTING_CONTEXT" > /tmp/existing_context.txt
          echo "$EXISTING_LINES"          > /tmp/existing_lines.txt

          echo "Existing context: ${EXISTING_LINES} lines"
          if [ -n "$DELETED_LIST" ]; then
            echo "Deleted/renamed files:"
            printf '%b' "$DELETED_LIST"
          fi

      # ── 3. Call GitHub Models (Copilot-backed) to update context ─────────────
      - name: Generate updated context via Copilot
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_DUMP=$(cat /tmp/changed_dump.txt)
          UNCHANGED_LIST=$(cat /tmp/unchanged_list.txt)
          DELETED_LIST=$(cat /tmp/deleted_list.txt)
          EXISTING=$(cat /tmp/existing_context.txt)
          EXISTING_LINES=$(cat /tmp/existing_lines.txt)

          # ── Build the prompt and write to a file to avoid "Argument list too long" ──
          # Shell --arg passing fails when the prompt exceeds ~2 MB; writing to a file
          # and using jq --rawfile sidesteps the OS ARG_MAX limit entirely.
          cat > /tmp/prompt.txt << 'PROMPT_EOF'
You are a senior FRC (FIRST Robotics Competition) software engineer maintaining `.github/CODEBASE_CONTEXT.md` for a WPILib-based robot codebase (2026 season). This file is read by GitHub Copilot as repo-wide context, so it must be maximally useful to an AI coding assistant and human developers alike.

## YOUR TASK
A push to main changed a small number of files. Update ONLY the sections of the existing context that are directly affected by those changed files.
All other sections must be reproduced VERBATIM — do not rephrase, summarize, condense, or restructure them.

## STRICT RULES
1. Unless files were deleted or renamed (see DELETED/RENAMED FILES below), the output MUST be at least EXISTING_LINES_PLACEHOLDER lines. Do NOT produce a shorter file.
2. For each entry in DELETED/RENAMED FILES: remove or update the corresponding context section. This is the ONLY circumstance where removing content is permitted.
3. Do NOT rewrite sections whose source files are listed under UNCHANGED FILES.
4. Preserve all season-specific wording, manual notes, warnings, and checklist items exactly.
5. Only output the raw Markdown — no preamble, no explanation.
PROMPT_EOF

          # Append the dynamic sections (file content) to the prompt file
          printf '\n## DELETED / RENAMED FILES (remove or update their context sections)\n' >> /tmp/prompt.txt
          printf '%s\n' "${DELETED_LIST:-(none)}"                                           >> /tmp/prompt.txt

          printf '\n## CHANGED FILES (full source — update context for these only)\n'       >> /tmp/prompt.txt
          printf '%s\n' "$CHANGED_DUMP"                                                     >> /tmp/prompt.txt

          printf '\n## UNCHANGED FILES (do not touch their context sections)\n'             >> /tmp/prompt.txt
          printf '%s\n' "$UNCHANGED_LIST"                                                   >> /tmp/prompt.txt

          printf '\n## EXISTING CODEBASE_CONTEXT.md (%s lines — reproduce in full, editing only sections affected by changed files above)\n' "$EXISTING_LINES" >> /tmp/prompt.txt
          printf '%s\n' "$EXISTING"                                                         >> /tmp/prompt.txt

          # Patch the line-count placeholder now that we know it
          sed -i "s/EXISTING_LINES_PLACEHOLDER/${EXISTING_LINES}/" /tmp/prompt.txt

          # Build JSON payload using --rawfile so jq reads the prompt from disk,
          # completely bypassing the shell argument size limit.
          jq -n \
            --rawfile prompt /tmp/prompt.txt \
            '{
              model: "gpt-4o-mini",
              messages: [{ role: "user", content: $prompt }],
              max_tokens: 16384,
              temperature: 0.1
            }' > /tmp/request.json

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/request.json \
            "https://models.inference.ai.azure.com/chat/completions")

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > /tmp/new_context.md

          NEW_LINES=$(wc -l < /tmp/new_context.md)
          EXISTING_LINES=$(cat /tmp/existing_lines.txt)
          echo "Existing context: ${EXISTING_LINES} lines — Generated context: ${NEW_LINES} lines"

          if [ "$NEW_LINES" -lt 5 ]; then
            echo "ERROR: Generated context looks too short. Raw response:"
            echo "$RESPONSE"
            exit 1
          fi

          # Warn loudly if the model shrunk the file significantly (>15% loss)
          THRESHOLD=$(( EXISTING_LINES * 85 / 100 ))
          if [ "$NEW_LINES" -lt "$THRESHOLD" ]; then
            echo "WARNING: Generated context is ${NEW_LINES} lines but existing is ${EXISTING_LINES} lines (threshold: ${THRESHOLD})."
            echo "The model may have incorrectly removed content. Review the PR carefully before merging."
          fi

      # ── 4. Check if anything actually changed ────────────────────────────────
      - name: Check for changes
        id: diff
        run: |
          if diff -q .github/CODEBASE_CONTEXT.md /tmp/new_context.md > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to CODEBASE_CONTEXT.md — skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ── 5. Ensure required labels exist ──────────────────────────────────────
      - name: Ensure PR labels exist
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "documentation" --color "0075ca" --description "Improvements or additions to documentation" 2>/dev/null || true
          gh label create "automated"     --color "e4e669" --description "Opened automatically by a GitHub Actions bot"  2>/dev/null || true

      # ── 6. Commit to a new branch and open a PR ───────────────────────────────
      - name: Create PR with updated context
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="bot/update-codebase-context-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          cp /tmp/new_context.md .github/CODEBASE_CONTEXT.md

          git add .github/CODEBASE_CONTEXT.md
          git commit -m "docs: auto-update .github/CODEBASE_CONTEXT.md from src/main changes

          Triggered by push to main.
          Updated by GitHub Copilot (gpt-4o-mini via GitHub Models).
          [skip ci]"

          git push origin "$BRANCH"

          # Line count delta for the PR body
          NEW_LINES=$(wc -l < /tmp/new_context.md)
          EXISTING_LINES=$(cat /tmp/existing_lines.txt)
          LINE_DELTA=$(( NEW_LINES - EXISTING_LINES ))
          if [ "$LINE_DELTA" -ge 0 ]; then
            DELTA_STR="+${LINE_DELTA}"
          else
            DELTA_STR="${LINE_DELTA} ⚠️ lines were removed — review carefully"
          fi

          # Changed files list for PR body (uses name-status for full picture)
          CHANGED_LIST=""
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            ALL_STATUS=$(git ls-tree -r --name-only HEAD -- src/main build.gradle build.gradle.kts | sed 's/^/M\t/' || true)
          else
            ALL_STATUS=$(git diff --name-status "$BEFORE" ${{ github.sha }} \
                         -- 'src/main/**' 'build.gradle' 'build.gradle.kts' || true)
          fi
          while IFS='	' read -r status path1 path2; do
            [ -z "$status" ] && continue
            case "$status" in
              D*) CHANGED_LIST="${CHANGED_LIST}- 🗑️ \`${path1}\` (deleted)"$'\n' ;;
              R*) CHANGED_LIST="${CHANGED_LIST}- 🔄 \`${path1}\` → \`${path2}\` (renamed)"$'\n' ;;
              A*) CHANGED_LIST="${CHANGED_LIST}- ✨ \`${path1}\` (added)"$'\n' ;;
              *)  CHANGED_LIST="${CHANGED_LIST}- 📝 \`${path1}\`"$'\n' ;;
            esac
          done <<< "$ALL_STATUS"

          gh pr create \
            --title "docs: Update .github/CODEBASE_CONTEXT.md (auto-generated)" \
            --body "## 🤖 Automated Codebase Context Update

          This PR was automatically generated after a push to \`main\` modified files under \`src/main/\` or build files.
          Only sections relevant to the changed files below were updated; all other sections are unchanged.

          ### Source files changed
          ${CHANGED_LIST}
          ### Line count
          ${EXISTING_LINES} → ${NEW_LINES} (${DELTA_STR})

          > **Please review before merging.** If lines were unexpectedly removed, edit this branch directly before merging.

          ### Trigger commit
          - Commit: \`${{ github.sha }}\`
          - Author: \`${{ github.actor }}\`
          - Pushed at: \`$(date -u)\`" \
            --head "$BRANCH" \
            --base "main" \
            --label "documentation" \
            --label "automated"