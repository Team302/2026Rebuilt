name: Update Codebase Context

on:
  push:
    branches:
      - main
    paths:
      - "src/main/**"
      - "build.gradle"
      - "build.gradle.kts"
  workflow_dispatch: # Allow manual runs from the GitHub Actions UI or CLI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-context:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout full history so we can diff ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Build the prompt and open a PR ────────────────────────────────────
      # No AI API calls — just collect changed files and produce a ready-to-paste
      # prompt that a developer can drop into ChatGPT / Copilot / Claude etc.
      - name: Build prompt and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ── Detect manual dispatch vs real push ───────────────────────────────
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Manual run — listing all tracked source files."
            ALL_STATUS=$(git ls-tree -r --name-only HEAD -- src/main build.gradle build.gradle.kts \
                         | sed 's/^/M\t/' || true)
            RUN_MODE="full-rebuild"
          else
            ALL_STATUS=$(git diff --name-status "$BEFORE" ${{ github.sha }} \
                         -- 'src/main/**' 'build.gradle' 'build.gradle.kts' || true)
            RUN_MODE="incremental"
          fi

          if [ -z "$ALL_STATUS" ]; then
            echo "No source files changed — nothing to do."
            exit 0
          fi

          # ── Build human-readable changed-file list ────────────────────────────
          CHANGED_LIST=""
          DELETED_LIST=""
          while IFS='' read -r status path1 path2; do
            [ -z "$status" ] && continue
            case "$status" in
              D*) CHANGED_LIST="${CHANGED_LIST}    🗑️ \`${path1}\` (deleted)"$'\n'
                  DELETED_LIST="${DELETED_LIST}  - DELETED: ${path1}"$'\n' ;;
              R*) CHANGED_LIST="${CHANGED_LIST}    🔄 \`${path1}\` → \`${path2}\` (renamed)"$'\n' ;;
              A*) CHANGED_LIST="${CHANGED_LIST}    ✨ \`${path1}\` (added)"$'\n' ;;
              *)  CHANGED_LIST="${CHANGED_LIST}    📝 \`${path1}\`"$'\n' ;;
            esac
          done <<< "$ALL_STATUS"

          FILE_COUNT=$(echo "$ALL_STATUS" | grep -c . || true)

          # ── Read existing context ─────────────────────────────────────────────
          EXISTING_LINES=0
          EXISTING_SNIPPET="(file does not exist yet)"
          TRUNCATED_NOTE=""
          if [ -f ".github/CODEBASE_CONTEXT.md" ]; then
            EXISTING_LINES=$(wc -l < .github/CODEBASE_CONTEXT.md)
            EXISTING_BYTES=$(wc -c < .github/CODEBASE_CONTEXT.md)
            EXISTING_SNIPPET=$(head -c 8000 .github/CODEBASE_CONTEXT.md)
            if [ "$EXISTING_BYTES" -gt 8000 ]; then
              TRUNCATED_NOTE="[... file truncated at 8 000 characters — paste the FULL file yourself before sending to AI ...]"
            fi
          fi

          # ── Write the prompt file ─────────────────────────────────────────────
          # Using printf instead of heredoc to avoid YAML/shell parsing conflicts.
          printf '%s\n' \
            "You are a senior FRC (FIRST Robotics Competition) software engineer maintaining" \
            "\`.github/CODEBASE_CONTEXT.md\` for a WPILib C++ robot codebase (Team 302, 2026 season)." \
            "This file is read by GitHub Copilot as repo-wide context, so keep it maximally useful" \
            "to both AI coding assistants and human developers." \
            "" \
            "## YOUR TASK" \
            "" \
            "The files listed under **CHANGED FILES** were modified in a recent push to \`main\`." \
            "Update \`.github/CODEBASE_CONTEXT.md\` accordingly:" \
            "" \
            "- Update **only** the sections directly affected by the changed files." \
            "- Reproduce every other section **verbatim** — do not rephrase, condense, or restructure." \
            "- If a deleted file is the sole subject of a context section, remove that section." \
            "- The output must be **at least as many lines** as the existing document (unless files were deleted)." \
            "- Output **only** raw Markdown — no preamble, explanation, or outer code fences." \
            "" \
            "## CHANGED FILES" \
            "" \
            "$CHANGED_LIST" \
            > /tmp/ai_prompt.md

          if [ -n "$DELETED_LIST" ]; then
            printf '\n## DELETED / RENAMED FILES\n\n%s\n' "$DELETED_LIST" >> /tmp/ai_prompt.md
          fi

          printf '\n## EXISTING `.github/CODEBASE_CONTEXT.md` (%s lines)\n\n' "$EXISTING_LINES" >> /tmp/ai_prompt.md
          printf 'Paste the **full** file contents here before sending to the AI.\n'             >> /tmp/ai_prompt.md
          printf 'The first 8 000 characters are included below as a reference:\n\n'             >> /tmp/ai_prompt.md
          printf '```markdown\n%s\n' "$EXISTING_SNIPPET"                                        >> /tmp/ai_prompt.md
          [ -n "$TRUNCATED_NOTE" ] && printf '\n%s\n' "$TRUNCATED_NOTE"                         >> /tmp/ai_prompt.md
          printf '```\n'                                                                         >> /tmp/ai_prompt.md

          PROMPT_BYTES=$(wc -c < /tmp/ai_prompt.md)
          echo "Prompt file size: ${PROMPT_BYTES} bytes"

          # ── Commit prompt file to a new branch and open a PR ─────────────────
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="bot/update-codebase-context-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          cp /tmp/ai_prompt.md .github/CODEBASE_CONTEXT_PROMPT.md

          git add .github/CODEBASE_CONTEXT_PROMPT.md
          git commit -m "docs: add AI prompt for CODEBASE_CONTEXT update (${FILE_COUNT} files changed)

          Triggered by push to main — ${RUN_MODE} mode.
          Copy .github/CODEBASE_CONTEXT_PROMPT.md into your AI of choice,
          paste the result back into .github/CODEBASE_CONTEXT.md, and merge this PR.
          [skip ci]"

          git push origin "$BRANCH"

          # ── Ensure labels exist ───────────────────────────────────────────────
          gh label create "documentation" --color "0075ca" --description "Improvements or additions to documentation" 2>/dev/null || true
          gh label create "automated"     --color "e4e669" --description "Opened automatically by a GitHub Actions bot"  2>/dev/null || true

          # ── Open the PR ───────────────────────────────────────────────────────
          gh pr create \
            --title "docs: Update .github/CODEBASE_CONTEXT.md (${FILE_COUNT} files changed)" \
            --body "## 🤖 Codebase Context — Update Required

          A push to \`main\` changed **${FILE_COUNT} source file(s)**. This PR contains a ready-to-use AI prompt — no API calls are made by the workflow.

          ### ✅ Steps to update \`CODEBASE_CONTEXT.md\`

          1. **Download** \`.github/CODEBASE_CONTEXT_PROMPT.md\` from this branch (Files tab above).
          2. Open your AI of choice (ChatGPT, Claude, Copilot Chat, etc.).
          3. Replace the truncated snippet in the prompt with the **full** contents of \`.github/CODEBASE_CONTEXT.md\`.
          4. Send the prompt and copy the AI response.
          5. On this branch, replace \`.github/CODEBASE_CONTEXT.md\` with the AI's output.
          6. Merge this PR.

          ### 📋 Source files changed

          ${CHANGED_LIST}

          ### 🔗 Trigger
          - Commit: \`${{ github.sha }}\`
          - Author: \`${{ github.actor }}\`
          - Mode: \`${RUN_MODE}\`
          - Time: \`$(date -u)\`" \
            --head "$BRANCH" \
            --base "main" \
            --label "documentation" \
            --label "automated"
