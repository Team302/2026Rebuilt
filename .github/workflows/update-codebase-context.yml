name: Update Codebase Context

on:
  push:
    branches:
      - main
    paths:
      - "src/main/**"
      - "build.gradle"
      - "build.gradle.kts"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Specific commit SHA to summarize for CODEBASE_CONTEXT review input"
        required: false
        type: string
      pr_number:
        description: "PR number to comment on. If omitted, the workflow will try to resolve it from the commit."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment-context:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout full history so manual SHA targeting works reliably ─────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Collect last-commit context for external AI use ───────────────────
      - name: Collect last commit context
        id: gather
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          TARGET_SHA="$DEFAULT_SHA"
          if [ -n "$INPUT_COMMIT_SHA" ]; then
            TARGET_SHA="$INPUT_COMMIT_SHA"
          fi

          if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "Commit ${TARGET_SHA} is not available in the checked out history."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          PARENT_SHA=$(git rev-parse "${TARGET_SHA}^1" 2>/dev/null || true)
          if [ -z "$PARENT_SHA" ]; then
            echo "No parent commit found for ${TARGET_SHA}; skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALL_STATUS=$(git diff --name-status "$PARENT_SHA" "$TARGET_SHA" \
            -- 'src/main/**' 'build.gradle' 'build.gradle.kts' || true)

          if [ -z "$ALL_STATUS" ]; then
            echo "No relevant src/main or build file changes in the last commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          EXISTING_LINES=$(wc -l < .github/CODEBASE_CONTEXT.md 2>/dev/null || echo "0")
          git log -1 --pretty=format:'%H' "$TARGET_SHA" > /tmp/target_sha.txt
          git log -1 --pretty=format:'%s' "$TARGET_SHA" > /tmp/commit_subject.txt
          git log -1 --pretty=format:'%an' "$TARGET_SHA" > /tmp/commit_author.txt
          git log -1 --pretty=format:'%B' "$TARGET_SHA" > /tmp/commit_message.txt
          printf '%s\n' "$ALL_STATUS" > /tmp/name_status.txt
          git diff --stat "$PARENT_SHA" "$TARGET_SHA" \
            -- 'src/main/**' 'build.gradle' 'build.gradle.kts' > /tmp/diff_stat.txt
          git diff --unified=3 --no-color "$PARENT_SHA" "$TARGET_SHA" \
            -- 'src/main/**' 'build.gradle' 'build.gradle.kts' > /tmp/raw_diff.txt
          cp .github/CODEBASE_CONTEXT.md /tmp/existing_context.md
          echo "$EXISTING_LINES" > /tmp/existing_lines.txt

          printf '%s\n' \
            "You are a senior FRC (FIRST Robotics Competition) software engineer maintaining .github/CODEBASE_CONTEXT.md for a WPILib-based robot codebase (2026 season). This file is read by GitHub Copilot as repo-wide context, so it must be maximally useful to an AI coding assistant and human developers alike." \
            "" \
            "## YOUR TASK" \
            "A push to main changed the files summarized below. Update ONLY the sections of the existing context that are directly affected by those changes." \
            "All other sections must be reproduced VERBATIM — do not rephrase, summarize, condense, or restructure them." \
            "" \
            "## STRICT RULES" \
            "1. Unless files were deleted or renamed (see CHANGED FILES / DIFF below), the output MUST be at least ${EXISTING_LINES} lines. Do NOT produce a shorter file." \
            "2. If a file was deleted or renamed, remove or update only the corresponding context entries. This is the ONLY circumstance where removing content is permitted." \
            "3. Preserve all season-specific wording, manual notes, warnings, and checklist items exactly unless directly contradicted by the changed files." \
            "4. Only output the raw Markdown for the updated .github/CODEBASE_CONTEXT.md — no preamble, no explanation." \
            > /tmp/ai_prompt.txt

      # ── 3. Resolve the PR associated with the pushed commit ──────────────────
      - name: Resolve associated PR
        id: pr
        if: steps.gather.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -n "$INPUT_PR_NUMBER" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
          else
            TARGET_SHA=$(cat /tmp/target_sha.txt)
            PR_NUMBER=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/${TARGET_SHA}/pulls" \
              --jq 'map(select(.state == "closed" or .state == "open"))[0].number' 2>/dev/null || true)
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            TARGET_SHA=$(cat /tmp/target_sha.txt)
            echo "No associated PR found for commit ${TARGET_SHA}."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # ── 4. Build and post a reusable AI-input comment on the PR ──────────────
      - name: Post AI input comment to PR
        if: steps.gather.outputs.has_changes == 'true' && steps.pr.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          python3 <<'PY'
          import json
          import textwrap
          from pathlib import Path

          marker = "<!-- codebase-context-ai-input -->"
          target_sha = Path('/tmp/target_sha.txt').read_text().strip()
          commit_subject = Path('/tmp/commit_subject.txt').read_text().strip()
          commit_author = Path('/tmp/commit_author.txt').read_text().strip()
          commit_message = Path('/tmp/commit_message.txt').read_text().rstrip()
          name_status = Path('/tmp/name_status.txt').read_text().rstrip()
          diff_stat = Path('/tmp/diff_stat.txt').read_text().rstrip()
          raw_diff = Path('/tmp/raw_diff.txt').read_text().rstrip()
          prompt = Path('/tmp/ai_prompt.txt').read_text().rstrip()
          existing_context = Path('/tmp/existing_context.md').read_text().rstrip()
          existing_lines = Path('/tmp/existing_lines.txt').read_text().strip()

          header = textwrap.dedent(f"""\
          {marker}
          ## CODEBASE_CONTEXT update input

          This comment is generated for external AI use. It does not update `.github/CODEBASE_CONTEXT.md` automatically.

          ### Trigger commit
          - Commit: `{target_sha}`
          - Author: `{commit_author}`
          - Subject: `{commit_subject}`

          ### Prompt
          ~~~~text
          {prompt}
          ~~~~

          ### Commit message
          ~~~~text
          {commit_message}
          ~~~~

          ### Changed files
          ~~~~text
          {name_status}
          ~~~~

          ### Diff stat
          ~~~~text
          {diff_stat}
          ~~~~
          """)

          context_block = textwrap.dedent(f"""\
          ### Existing `.github/CODEBASE_CONTEXT.md` ({existing_lines} lines)
          ~~~~md
          {existing_context}
          ~~~~
          """)

          diff_header = "\n### Raw diff for affected files\n~~~~diff\n"
          diff_footer = "\n~~~~\n"
          body_without_diff = header + context_block

          max_chars = 62000
          available_for_diff = max_chars - len(body_without_diff) - len(diff_header) - len(diff_footer)
          if available_for_diff < 0:
            available_for_diff = 0

          if len(raw_diff) > available_for_diff:
            truncation_note = "\n[... raw diff truncated to fit GitHub comment size limits ...]"
            keep = max(0, available_for_diff - len(truncation_note))
            raw_diff = raw_diff[:keep] + truncation_note

          body = body_without_diff + diff_header + raw_diff + diff_footer
          Path('/tmp/pr_comment.md').write_text(body)
          Path('/tmp/pr_comment.json').write_text(json.dumps({"body": body}))
          PY

          EXISTING_COMMENT_ID=$(gh api \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- codebase-context-ai-input -->"))) | .id' \
            | tail -n 1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "/repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
              --input /tmp/pr_comment.json
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr_comment.md
          fi

      # ── 5. Write job summary for visibility when no PR is found ──────────────
      - name: Write workflow summary
        if: always()
        run: |
          if [ "${{ steps.gather.outputs.has_changes }}" != "true" ]; then
            echo "No relevant src/main or build.gradle changes were found for the requested commit." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.pr.outputs.found }}" != "true" ]; then
            echo "Relevant changes were found, but no associated PR could be resolved for the requested commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Posted CODEBASE_CONTEXT AI input comment to PR #${{ steps.pr.outputs.number }}." >> "$GITHUB_STEP_SUMMARY"
          fi