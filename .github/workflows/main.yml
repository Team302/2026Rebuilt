name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Cache the WPILib Docker image via docker save/load ───────────────────
      # docker pull ignores buildx cache dirs, so we save the image as a tar
      # and restore it directly into the Docker daemon. On a cache hit the pull
      # is skipped entirely; on a miss we pull and save for the next run.
      - name: Cache WPILib Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/wpilib-image.tar
          key: ${{ runner.os }}-wpilib-docker-2025-22.04

      - name: Load WPILib image from cache
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/wpilib-image.tar

      - name: Pull WPILib image and save to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull wpilib/roborio-cross-ubuntu:2025-22.04
          docker save wpilib/roborio-cross-ubuntu:2025-22.04 -o /tmp/wpilib-image.tar

      # ── Cache Gradle dependencies and build outputs ───────────────────────────
      # Stored at .gradle-home/ inside the workspace so it is always owned by
      # the runner user — never written to by root inside the container.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gradle-home/caches
            ${{ github.workspace }}/.gradle-home/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/vendordeps/*.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Declare repo safe (required when running inside a container) ──────────
      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      # ── Build inside the WPILib container, mounting the Gradle cache ──────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile and run tests on robot code
        run: |
          # Run as the current runner user (not root) so all files written into
          # .gradle-home/ are owned by the runner and safe for cache save/restore.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GRADLE_USER_HOME=/workspace/.gradle-home \
            wpilib/roborio-cross-ubuntu:2025-22.04 \
            ./gradlew frcProgramReleaseExecutable --no-daemon --build-cache
