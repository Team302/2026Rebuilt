name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Cache the WPILib Docker image layers ─────────────────────────────────
      # This avoids re-pulling the entire ~2 GB image on every run.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-wpilib-docker-2025-22.04
          restore-keys: |
            ${{ runner.os }}-wpilib-docker-

      - name: Pull WPILib cross-compiler image
        run: |
          docker pull wpilib/roborio-cross-ubuntu:2025-22.04

      # ── Cache Gradle dependencies and build outputs ───────────────────────────
      # Gradle re-downloads WPILib vendordeps and re-compiles unchanged code
      # without this cache, adding 1-3 min on cold runs.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/vendordeps/*.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Declare repo safe (required when running inside a container) ──────────
      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      # ── Build inside the WPILib container, mounting the Gradle cache ──────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile and run tests on robot code
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$HOME/.gradle:/root/.gradle" \
            -w /workspace \
            wpilib/roborio-cross-ubuntu:2025-22.04 \
            ./gradlew frcProgramReleaseExecutable --no-daemon --build-cache
